name: QA Check

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      node_version:
        description: "Node.js version"
        required: false
        default: "20"
      profile:
        description: "QA profile"
        required: false
        default: "ci"
        type: choice
        options:
          - report
          - ci
          - strict
      fail_on:
        description: "Override profile fail rule"
        required: false
        default: "profile"
        type: choice
        options:
          - profile
          - error
          - warning
          - none
      min_score:
        description: "Override profile minimum score. Use profile to keep profile default."
        required: false
        default: "profile"
      report_dir:
        description: "Report output folder"
        required: false
        default: "reports"

permissions:
  contents: read
  pull-requests: write

env:
  NODE_VERSION: ${{ github.event.inputs.node_version || '20' }}
  QA_PROFILE: ${{ github.event.inputs.profile || 'ci' }}
  FAIL_ON: ${{ github.event.inputs.fail_on || 'profile' }}
  MIN_SCORE: ${{ github.event.inputs.min_score || 'profile' }}
  REPORT_DIR: ${{ github.event.inputs.report_dir || 'reports' }}
  QA_CHECK_PACKAGE: qa-check-cli@latest

jobs:
  qa-check:
    name: Run QA Check
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Select QA project and report directory
        shell: bash
        run: |
          QA_PROJECT_DIR=.
          if [ -f apps/web/package.json ]; then
            QA_PROJECT_DIR=apps/web
          fi
          echo "QA_PROJECT_DIR=${QA_PROJECT_DIR}" >> "$GITHUB_ENV"
          echo "QA_OUTPUT_DIR=${REPORT_DIR}" >> "$GITHUB_ENV"
          echo "REPORT_DIR=${QA_PROJECT_DIR}/${REPORT_DIR}" >> "$GITHUB_ENV"
          echo "QA project: ${QA_PROJECT_DIR}"
          echo "Reports: ${QA_PROJECT_DIR}/${REPORT_DIR}"

      - name: Install project dependencies
        shell: bash
        run: |
          cd "${QA_PROJECT_DIR}"
          if [ -f package-lock.json ]; then
            npm ci
          elif [ -f package.json ]; then
            npm install
          else
            echo "No package.json found. Skipping project dependency installation."
          fi

      - name: Install browser dependencies
        shell: bash
        run: |
          echo "Installing Playwright Chromium for browser-based QA checks."
          npx -y playwright install --with-deps chromium

      - name: Debug Environment
        shell: bash
        run: |
          echo "========== DEBUG =========="
          node -v
          npm -v

          echo ""
          echo "Current Directory:"
          pwd

          echo ""
          echo "Files:"
          ls -la

          echo ""
          echo "QA Check package:"
          echo "${QA_CHECK_PACKAGE}"
          echo "QA Profile:"
          echo "${QA_PROFILE}"

          echo ""
          echo "==========================="

      - name: Run QA Check CLI
        id: qa
        shell: bash
        run: |
          set +e

          echo "========== RUNNING QA CHECK =========="

          QA_ARGS=("${QA_PROJECT_DIR}" --ci --pdf --profile "${QA_PROFILE}" --output "${QA_OUTPUT_DIR}")

          if [ "${FAIL_ON}" != "profile" ]; then
            QA_ARGS+=(--fail-on "${FAIL_ON}")
          fi

          if [ "${MIN_SCORE}" != "profile" ]; then
            QA_ARGS+=(--min-score "${MIN_SCORE}")
          fi

          npx -y "${QA_CHECK_PACKAGE}" "${QA_ARGS[@]}" 2>&1 | tee qa-output.log

          EXIT_CODE=${PIPESTATUS[0]}

          echo ""
          echo "========== QA OUTPUT =========="
          cat qa-output.log

          echo ""
          echo "exit_code=${EXIT_CODE}" >> "$GITHUB_OUTPUT"

          echo "QA Exit Code: ${EXIT_CODE}"

          exit 0

      - name: Detect generated reports
        id: reports
        if: always()
        shell: bash
        run: |
          if [ -d "${REPORT_DIR}" ] && [ "$(find "${REPORT_DIR}" -type f | wc -l)" -gt 0 ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Reports found."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "No reports found."
          fi

      - name: Write workflow summary
        if: always() && steps.reports.outputs.exists == 'true'
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require("fs");
          const path = require("path");

          const reportDir = process.env.REPORT_DIR || "reports";
          const summaryPath = process.env.GITHUB_STEP_SUMMARY;
          const reportPath = path.join(reportDir, "report.json");

          if (!summaryPath || !fs.existsSync(reportPath)) {
            process.exit(0);
          }

          const report = JSON.parse(fs.readFileSync(reportPath, "utf8"));
          const counts = { PASS: 0, WARNING: 0, FAIL: 0, ERROR: 0, SKIPPED: 0 };

          for (const result of report.results || []) {
            counts[result.status] = (counts[result.status] || 0) + 1;
          }

          const lines = [
            "# QA Check Report",
            "",
            `| Field | Value |`,
            `| --- | --- |`,
            `| Framework | ${report.framework || "Unknown"} |`,
            `| Pipeline | ${report.pipeline || "Unknown"} |`,
            `| Overall Score | ${report.overallScore ?? 0}/100 |`,
            `| PASS | ${counts.PASS} |`,
            `| WARNING | ${counts.WARNING} |`,
            `| FAIL | ${counts.FAIL + counts.ERROR} |`,
            `| SKIPPED | ${counts.SKIPPED} |`,
            "",
            "Reports were generated and uploaded when available.",
          ];

          fs.appendFileSync(summaryPath, `${lines.join("\n")}\n`);
          NODE

      - name: Comment on pull request
        if: always() && github.event_name == 'pull_request' && steps.reports.outputs.exists == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const path = require("path");
            const marker = "<!-- qa-check-cli-report -->";
            const reportPath = path.join(process.env.REPORT_DIR || "reports", "report.json");

            if (!fs.existsSync(reportPath)) {
              return;
            }

            const report = JSON.parse(fs.readFileSync(reportPath, "utf8"));
            const counts = { PASS: 0, WARNING: 0, FAIL: 0, ERROR: 0, SKIPPED: 0 };

            for (const result of report.results || []) {
              counts[result.status] = (counts[result.status] || 0) + 1;
            }

            const body = [
              marker,
              "## QA Check Report",
              "",
              `**Score:** ${report.overallScore ?? 0}/100`,
              `**Framework:** ${report.framework || "Unknown"}`,
              `**Pipeline:** ${report.pipeline || "Unknown"}`,
              "",
              "| Status | Count |",
              "| --- | ---: |",
              `| PASS | ${counts.PASS} |`,
              `| WARNING | ${counts.WARNING} |`,
              `| FAIL | ${counts.FAIL + counts.ERROR} |`,
              `| SKIPPED | ${counts.SKIPPED} |`,
              "",
              "Download the uploaded `qa-check-reports` artifact to view HTML, JSON, PDF, and screenshots.",
            ].join("\n");

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const previous = comments.data.find((comment) => comment.body?.includes(marker));

            if (previous) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: previous.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }

      - name: Upload QA Reports
        if: always() && steps.reports.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: qa-check-reports
          path: |
            ${{ env.REPORT_DIR }}/index.html
            ${{ env.REPORT_DIR }}/report.json
            ${{ env.REPORT_DIR }}/report.md
            ${{ env.REPORT_DIR }}/report.pdf
            ${{ env.REPORT_DIR }}/screenshots/**
          if-no-files-found: warn
          retention-days: 14

      - name: Fail workflow when QA threshold is not met
        if: always() && steps.qa.outputs.exit_code != '0'
        env:
          QA_EXIT_CODE: ${{ steps.qa.outputs.exit_code }}
        shell: bash
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';

          const reportPath = path.join(process.env.REPORT_DIR || 'reports', 'report.json');
          if (!fs.existsSync(reportPath)) {
            console.log(`No report.json found at ${reportPath}. Inspect the earlier Install project dependencies and Run QA Check CLI steps for the execution failure.`);
          } else {
            try {
              const report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
              const failed = (report.results || []).filter((result) =>
                result.status === 'FAIL' || result.status === 'ERROR'
              );
              console.log(`Overall QA score: ${report.overallScore ?? 'unknown'}/100`);
              console.log(`Failed/error checks: ${failed.length}`);
              for (const result of failed) {
                const name = String(result.name || 'Unnamed check').replace(/[\r\n\x00-\x1f]/g, ' ').slice(0, 100);
                console.log(`  ${result.status}: ${name}`);
              }
              console.log('Download the qa-check-reports artifact and open index.html for findings and suggested fixes.');
            } catch {
              console.log('report.json could not be read. Inspect the earlier QA step and downloaded artifacts.');
            }
          }
          NODE

          echo "QA Check completed, reports were uploaded when available."
          echo "Failing this workflow because --ci returned exit code ${QA_EXIT_CODE:-unknown}."
          echo "This usually means one or more checks matched the configured --fail-on threshold (${FAIL_ON})."
          exit "${QA_EXIT_CODE:-1}"
